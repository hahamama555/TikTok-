<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>マス目名前書きツール</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  background: #ffffff;
}

body {
  margin: 0;
  padding: 15px 10px 30px;
  background: #ffffff;
  color: #222;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    "Noto Sans JP",
    sans-serif;
}

/* 設定エリア */
#settings {
  max-width: 900px;
  margin: 0 auto 15px;
  padding: 15px;
  border: 2px solid #ddd;
  border-radius: 15px;
  background: #f7f7f7;
}

#settings h2 {
  margin: 0 0 12px;
  font-size: 20px;
  text-align: center;
}

.setting-row {
  margin-bottom: 12px;
}

.setting-row label {
  display: block;
  font-weight: bold;
  margin-bottom: 5px;
}

input[type="text"],
input[type="number"] {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  border: 1px solid #bbb;
  border-radius: 8px;
  background: #fff;
}

button {
  border: none;
  border-radius: 9px;
  padding: 11px 15px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

button:active {
  transform: scale(0.97);
}

.btn-blue {
  background: #2196f3;
  color: white;
}

.btn-green {
  background: #20a060;
  color: white;
}

.btn-gray {
  background: #777;
  color: white;
}

.btn-red {
  background: #e53935;
  color: white;
}

.button-area {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}

/* タイトル */
#boardTitle {
  max-width: 1000px;
  margin: 10px auto 15px;
  text-align: center;
  font-size: clamp(22px, 6vw, 42px);
  font-weight: bold;
}

/* 操作説明 */
#modeText {
  max-width: 1000px;
  margin: 0 auto 12px;
  text-align: center;
  font-size: 14px;
  color: #666;
}

/* マス */
#board {
  width: 100%;
  max-width: 1000px;
  margin: 0 auto;
  display: grid;
  gap: 5px;
}

/* 各マス */
.cell {
  min-width: 0;
  min-height: 62px;
  padding: 6px 4px;

  display: flex;
  align-items: center;
  justify-content: center;

  text-align: center;
  word-break: break-word;
  overflow-wrap: anywhere;

  background: #9edff5;
  color: #222;

  border: 2px solid #62bcd9;
  border-radius: 8px;

  font-size: clamp(12px, 3.2vw, 22px);
  font-weight: bold;

  user-select: none;
  -webkit-user-select: none;
  cursor: pointer;

  touch-action: manipulation;

  transition:
    background 0.15s,
    color 0.15s,
    transform 0.1s;
}

/* 名前が入ったマス */
.cell.completed {
  background: #e53935;
  border-color: #b71c1c;
  color: #ffffff;
}

/* タップ時 */
.cell:active {
  transform: scale(0.97);
}

/* 名前部分 */
.cell .name {
  display: block;
  width: 100%;
}

.cell .place {
  display: block;
  width: 100%;
}

.cell .name-text {
  display: block;
  margin-top: 3px;
  font-size: 0.8em;
}

/* 配信用モード */
body.live-mode {
  padding: 0 8px 30px;
}

body.live-mode #settings {
  display: none;
}

body.live-mode #modeText {
  display: none;
}

body.live-mode #boardTitle {
  margin-top: 8px;
}

/* 小さいスマホ */
@media (max-width: 500px) {
  body {
    padding-left: 5px;
    padding-right: 5px;
    padding-bottom: 30px;
  }

  #settings {
    padding: 10px;
  }

  .cell {
    min-height: 58px;
    border-radius: 7px;
    border-width: 2px;
  }

  #board {
    gap: 4px;
  }
}
</style>
</head>

<body>

<div id="settings">

  <h2>⚙️ ボード設定</h2>

  <div class="setting-row">
    <label for="titleInput">タイトル</label>
    <input
      id="titleInput"
      type="text"
      value="47都道府県制覇！"
      placeholder="タイトルを入力">
  </div>

  <div class="setting-row">
    <label for="countInput">マス数（1〜200）</label>
    <input
      id="countInput"
      type="number"
      value="47"
      min="1"
      max="200"
      inputmode="numeric">
  </div>

  <div class="button-area">

    <button
      class="btn-blue"
      id="createButton">
      マスを作成
    </button>

    <button
      class="btn-green"
      id="nameModeButton">
      ✏️ 名前を書く
    </button>

    <button
      class="btn-gray"
      id="editModeButton">
      📝 マス名称変更
    </button>

    <button
      class="btn-red"
      id="resetButton">
      🔄 リセット
    </button>

    <button
      class="btn-gray"
      id="liveButton">
      📺 配信用画面
    </button>

  </div>

  <div style="margin-top:10px;font-size:13px;color:#666;">
    「マス名称変更」→ マスをタップすると名称を変更できます。<br>
    「名前を書く」→ マスをタップすると名前を入力できます。
  </div>

</div>

<h1 id="boardTitle">47都道府県制覇！</h1>

<div id="modeText">
  📝 マス名称変更モード
</div>

<div id="board"></div>


<script>
/* =========================
   初期データ
========================= */

const defaultNames = [
  "北海道",
  "青森県",
  "岩手県",
  "宮城県",
  "秋田県",
  "山形県",
  "福島県",
  "茨城県",
  "栃木県",
  "群馬県",
  "埼玉県",
  "千葉県",
  "東京都",
  "神奈川県",
  "新潟県",
  "富山県",
  "石川県",
  "福井県",
  "山梨県",
  "長野県",
  "岐阜県",
  "静岡県",
  "愛知県",
  "三重県",
  "滋賀県",
  "京都府",
  "大阪府",
  "兵庫県",
  "奈良県",
  "和歌山県",
  "鳥取県",
  "島根県",
  "岡山県",
  "広島県",
  "山口県",
  "徳島県",
  "香川県",
  "愛媛県",
  "高知県",
  "福岡県",
  "佐賀県",
  "長崎県",
  "熊本県",
  "大分県",
  "宮崎県",
  "鹿児島県",
  "沖縄県"
];

/* =========================
   状態
========================= */

let cells = [];
let mode = "edit";

/* =========================
   要素
========================= */

const board = document.getElementById("board");
const titleInput = document.getElementById("titleInput");
const countInput = document.getElementById("countInput");
const boardTitle = document.getElementById("boardTitle");
const modeText = document.getElementById("modeText");

const createButton = document.getElementById("createButton");
const nameModeButton = document.getElementById("nameModeButton");
const editModeButton = document.getElementById("editModeButton");
const resetButton = document.getElementById("resetButton");
const liveButton = document.getElementById("liveButton");

/* =========================
   ボード作成
========================= */

function createBoard() {

  let count = parseInt(countInput.value, 10);

  if (isNaN(count)) {
    count = 1;
  }

  if (count < 1) {
    count = 1;
  }

  if (count > 200) {
    count = 200;
  }

  countInput.value = count;

  boardTitle.textContent =
    titleInput.value.trim() || "タイトル";

  cells = [];

  for (let i = 0; i < count; i++) {

    cells.push({
      name:
        defaultNames[i]
        || "マス" + (i + 1),

      person: "",
      completed: false
    });
  }

  renderBoard();
}


/* =========================
   表示
========================= */

function renderBoard() {

  board.innerHTML = "";

  const count = cells.length;

  /*
    スマホでは5列を基本にする。
    200マスでも自動で行が増える。
  */

  let columns = 5;

  if (count <= 2) {
    columns = count;
  } else if (count <= 4) {
    columns = 2;
  } else if (count <= 6) {
    columns = 3;
  }

  board.style.gridTemplateColumns =
    `repeat(${columns}, minmax(0, 1fr))`;

  cells.forEach((cellData, index) => {

    const cell = document.createElement("div");

    cell.className = "cell";

    if (cellData.completed) {
      cell.classList.add("completed");
    }

    const place = document.createElement("span");
    place.className = "place";
    place.textContent = cellData.name;

    cell.appendChild(place);

    if (cellData.person) {

      const person = document.createElement("span");
      person.className = "name-text";
      person.textContent =
        cellData.person;

      cell.appendChild(person);
    }

    /*
      マスをタップ
    */

    cell.addEventListener("click", function() {

      handleCellClick(index);

    });

    board.appendChild(cell);

  });
}


/* =========================
   マスをタップ
========================= */

function handleCellClick(index) {

  const cellData = cells[index];

  /* マス名称変更 */

  if (mode === "edit") {

    const newName = prompt(
      "マスの名称を入力してください",
      cellData.name
    );

    if (newName !== null) {

      const trimmed =
        newName.trim();

      if (trimmed !== "") {

        cellData.name = trimmed;

      }

      renderBoard();
    }

    return;
  }


  /* 名前を書く */

  if (mode === "name") {

    const personName = prompt(
      cellData.name +
      " に名前を書きます。\n\n名前を入力してください。",
      cellData.person || ""
    );

    if (personName !== null) {

      const trimmed =
        personName.trim();

      if (trimmed === "") {

        cellData.person = "";
        cellData.completed = false;

      } else {

        cellData.person = trimmed;
        cellData.completed = true;

      }

      renderBoard();
    }

  }

}


/* =========================
   モード変更
========================= */

function setMode(newMode) {

  mode = newMode;

  if (mode === "edit") {

    modeText.textContent =
      "📝 マス名称変更モード";

  }

  if (mode === "name") {

    modeText.textContent =
      "✏️ 名前を書くモード";

  }

}


/* =========================
   ボタン
========================= */

createButton.addEventListener(
  "click",
  function() {

    createBoard();

  }
);


nameModeButton.addEventListener(
  "click",
  function() {

    setMode("name");

  }
);


editModeButton.addEventListener(
  "click",
  function() {

    setMode("edit");

  }
);


resetButton.addEventListener(
  "click",
  function() {

    const ok =
      confirm(
        "すべてのマスをリセットしますか？"
      );

    if (!ok) {
      return;
    }

    cells.forEach(function(cell) {

      cell.person = "";
      cell.completed = false;

    });

    renderBoard();

  }
);


/* =========================
   配信用画面
========================= */

liveButton.addEventListener(
  "click",
  function() {

    document.body.classList.toggle(
      "live-mode"
    );

    if (
      document.body.classList.contains(
        "live-mode"
      )
    ) {

      liveButton.textContent =
        "↩️ 設定画面に戻る";

    } else {

      liveButton.textContent =
        "📺 配信用画面";

    }

  }
);


/* =========================
   タイトル変更
========================= */

titleInput.addEventListener(
  "input",
  function() {

    boardTitle.textContent =
      titleInput.value.trim()
      || "タイトル";

  }
);


/* =========================
   初期表示
========================= */

createBoard();

</script>

</body>
</html>
