<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>3企画ボード</title>

<style>

/* =========================
   基本
========================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #ffffff;
}

body {
  padding: 7px 5px 50px;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    "Noto Sans JP",
    sans-serif;

  color: #222222;
}


/* =========================
   企画切り替え
========================= */

#projectTabs {
  width: 100%;
  max-width: 1000px;

  margin: 0 auto 8px;

  display: grid;
  grid-template-columns: repeat(3, 1fr);

  gap: 5px;
}

.projectTab {
  height: 44px;

  border: none;
  border-radius: 8px;

  background: #dddddd;
  color: #333333;

  font-size: 15px;
  font-weight: bold;

  cursor: pointer;
  touch-action: manipulation;
}

.projectTab.active {
  background: #2196f3;
  color: #ffffff;
}

.projectTab:active {
  transform: scale(0.96);
}


/* =========================
   設定
========================= */

#settings {
  width: 100%;
  max-width: 900px;

  margin: 0 auto 8px;

  padding: 10px;

  background: #f5f5f5;

  border: 1px solid #dddddd;
  border-radius: 10px;
}

.setting {
  margin-bottom: 8px;
}

.setting label {
  display: block;

  margin-bottom: 4px;

  font-size: 13px;
  font-weight: bold;
}

.setting input {
  width: 100%;
  height: 40px;

  padding: 6px 8px;

  background: #ffffff;

  border: 1px solid #aaaaaa;
  border-radius: 6px;

  font-size: 16px;

  outline: none;
}


/* =========================
   ボタン
========================= */

.buttons {
  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 6px;

  margin-top: 8px;
}

.buttons button {
  min-height: 42px;

  border: none;
  border-radius: 8px;

  color: #ffffff;

  font-size: 13px;
  font-weight: bold;

  cursor: pointer;

  touch-action: manipulation;
}

.buttons button:active {
  transform: scale(0.96);
}

#createButton {
  background: #2196f3;
}

#nameEditButton {
  background: #7b1fa2;
}

#nameButton {
  background: #f57c00;
}

#resetButton {
  background: #e53935;
}


/* =========================
   モード表示
========================= */

#mode {
  width: 100%;
  max-width: 900px;

  margin: 5px auto;

  text-align: center;

  font-size: 13px;

  color: #666666;
}


/* =========================
   ★名称一覧
   最初は完全非表示
========================= */

#nameEditor {
  display: none;

  margin-top: 10px;

  padding-top: 10px;

  border-top: 1px solid #cccccc;
}

#nameEditorTitle {
  margin-bottom: 8px;

  text-align: center;

  font-size: 15px;

  font-weight: bold;
}

#nameList {
  max-height: 350px;

  overflow-y: auto;

  display: flex;

  flex-direction: column;

  gap: 5px;
}

.nameRow {
  display: grid;

  grid-template-columns:
    35px minmax(0, 1fr);

  gap: 5px;

  align-items: center;
}

.nameNumber {
  text-align: center;

  color: #666666;

  font-size: 12px;

  font-weight: bold;
}

.nameInput {
  width: 100%;

  height: 38px;

  padding: 5px 8px;

  background: #ffffff;

  border: 1px solid #aaaaaa;

  border-radius: 6px;

  font-size: 14px;

  outline: none;
}

.nameInput:focus {
  border-color: #2196f3;
}


/* =========================
   名称保存
========================= */

#saveNamesButton {
  width: 100%;

  height: 40px;

  margin-top: 7px;

  border: none;

  border-radius: 7px;

  background: #43a047;

  color: #ffffff;

  font-size: 14px;

  font-weight: bold;

  cursor: pointer;
}


/* =========================
   タイトル
========================= */

#title {
  width: 100%;
  max-width: 1000px;

  margin: 6px auto 9px;

  text-align: center;

  font-size:
    clamp(21px, 6vw, 40px);

  line-height: 1.2;

  font-weight: bold;

  word-break: break-word;
}


/* =========================
   ボード
========================= */

#board {
  width: 100%;
  max-width: 1000px;

  margin: 0 auto;

  display: grid;

  grid-template-columns:
    repeat(5, minmax(0, 1fr));

  gap: 5px;
}


/* =========================
   マス
========================= */

.cell {
  width: 100%;

  min-width: 0;

  min-height: 70px;

  padding: 6px 3px;

  background: #9edff5;

  border: 2px solid #55b4d4;

  border-radius: 8px;

  display: flex;

  flex-direction: column;

  justify-content: center;

  align-items: center;

  text-align: center;

  cursor: pointer;

  user-select: none;

  touch-action: manipulation;

  overflow: hidden;
}

.cell:active {
  transform: scale(0.96);
}


/* =========================
   マス名称
========================= */

.cellName {
  display: block;

  width: 100%;

  color: #111111;

  font-size:
    clamp(10px, 3vw, 20px);

  font-weight: bold;

  line-height: 1.2;

  text-align: center;

  white-space: normal;

  word-break: break-all;

  writing-mode: horizontal-tb;
}


/* =========================
   視聴者名
========================= */

.cellUser {
  display: block;

  width: 100%;

  margin-top: 4px;

  color: #111111;

  font-size:
    clamp(8px, 2.5vw, 16px);

  font-weight: bold;

  line-height: 1.2;

  text-align: center;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}


/* =========================
   名前入力後
========================= */

.cell.done {
  background: #e53935;

  border-color: #b71c1c;
}

.cell.done .cellName,
.cell.done .cellUser {
  color: #ffffff;
}


/* =========================
   100〜200マス
========================= */

.many .cell {
  min-height: 48px;

  padding: 4px 2px;
}

.many .cellName {
  font-size: 9px;
}

.many .cellUser {
  font-size: 7px;

  margin-top: 2px;
}


/* =========================
   スマホ
========================= */

@media (max-width: 500px) {

  body {
    padding:
      5px 4px 40px;
  }

  #projectTabs {
    gap: 4px;
  }

  .projectTab {
    height: 40px;

    font-size: 14px;
  }

  #board {
    gap: 4px;
  }

  .cell {
    min-height: 65px;

    border-radius: 7px;
  }

}

</style>
</head>


<body>


<!-- =========================
     企画切り替え
========================= -->

<div id="projectTabs">

  <button
    id="project1"
    class="projectTab active">

    企画①

  </button>

  <button
    id="project2"
    class="projectTab">

    企画②

  </button>

  <button
    id="project3"
    class="projectTab">

    企画③

  </button>

</div>


<!-- =========================
     設定
========================= -->

<div id="settings">


  <div class="setting">

    <label>
      タイトル
    </label>

    <input
      id="titleInput"
      type="text"
      value="47都道府県制覇！">

  </div>


  <div class="setting">

    <label>
      マス数（1〜200）
    </label>

    <input
      id="countInput"
      type="number"
      min="1"
      max="200"
      value="47">

  </div>


  <!-- =======================
       ボタン
  ======================== -->

  <div class="buttons">

    <button id="createButton">
      マスを作る
    </button>

    <button id="nameEditButton">
      📝 マス名称変更
    </button>

    <button id="nameButton">
      ✏️ 名前を書く
    </button>

    <button id="resetButton">
      🔄 名前リセット
    </button>

  </div>


  <!-- =======================
       ★名称一覧
       初期状態はdisplay:none
  ======================== -->

  <div id="nameEditor">

    <div id="nameEditorTitle">
      📝 マス名称一覧
    </div>

    <div id="nameList"></div>

    <button id="saveNamesButton">
      💾 名称を保存
    </button>

  </div>

</div>


<!-- =========================
     モード
========================= -->

<div id="mode">
  ✏️「名前を書く」モード
</div>


<!-- =========================
     タイトル
========================= -->

<div id="title">
  47都道府県制覇！
</div>


<!-- =========================
     ボード
========================= -->

<div id="board"></div>


<script>

/* =====================================================
   都道府県
===================================================== */

const prefectures = [

  "北海道",
  "青森県",
  "岩手県",
  "宮城県",
  "秋田県",
  "山形県",
  "福島県",

  "茨城県",
  "栃木県",
  "群馬県",
  "埼玉県",
  "千葉県",
  "東京都",
  "神奈川県",

  "新潟県",
  "富山県",
  "石川県",
  "福井県",
  "山梨県",
  "長野県",

  "岐阜県",
  "静岡県",
  "愛知県",
  "三重県",

  "滋賀県",
  "京都府",
  "大阪府",
  "兵庫県",
  "奈良県",
  "和歌山県",

  "鳥取県",
  "島根県",
  "岡山県",
  "広島県",
  "山口県",

  "徳島県",
  "香川県",
  "愛媛県",
  "高知県",

  "福岡県",
  "佐賀県",
  "長崎県",
  "熊本県",
  "大分県",
  "宮崎県",
  "鹿児島県",
  "沖縄県"

];


/* =====================================================
   マス作成
===================================================== */

function makeCells(
  count,
  usePrefectures
) {

  const result = [];

  for (
    let i = 0;
    i < count;
    i++
  ) {

    let name;

    if (
      usePrefectures &&
      prefectures[i]
    ) {

      name =
        prefectures[i];

    } else {

      name =
        "マス" +
        (i + 1);

    }

    result.push({

      name: name,

      user: ""

    });

  }

  return result;
}


/* =====================================================
   3つの企画
===================================================== */

const projects = {

  1: {
    title:
      "47都道府県制覇！",

    count:
      47,

    cells:
      makeCells(47, true)
  },

  2: {
    title:
      "企画②",

    count:
      25,

    cells:
      makeCells(25, false)
  },

  3: {
    title:
      "企画③",

    count:
      25,

    cells:
      makeCells(25, false)
  }

};


/* =====================================================
   現在の企画
===================================================== */

let currentProject = 1;


/* =====================================================
   モード
===================================================== */

let mode = "name";


/* =====================================================
   要素
===================================================== */

const board =
  document.getElementById(
    "board"
  );

const title =
  document.getElementById(
    "title"
  );

const titleInput =
  document.getElementById(
    "titleInput"
  );

const countInput =
  document.getElementById(
    "countInput"
  );

const nameEditor =
  document.getElementById(
    "nameEditor"
  );

const nameList =
  document.getElementById(
    "nameList"
  );

const modeText =
  document.getElementById(
    "mode"
  );

const nameEditButton =
  document.getElementById(
    "nameEditButton"
  );


/* =====================================================
   現在の企画
===================================================== */

function getProject() {

  return projects[
    currentProject
  ];

}


/* =====================================================
   保存
===================================================== */

function saveData() {

  try {

    localStorage.setItem(
      "threeProjectBoard",
      JSON.stringify(projects)
    );

  } catch (error) {

    console.log(error);

  }

}


/* =====================================================
   名称一覧
===================================================== */

function renderNameList() {

  const project =
    getProject();

  nameList.innerHTML = "";


  project.cells.forEach(

    function(
      data,
      index
    ) {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "nameRow";


      const number =
        document.createElement(
          "div"
        );

      number.className =
        "nameNumber";

      number.textContent =
        index + 1;


      const input =
        document.createElement(
          "input"
        );

      input.className =
        "nameInput";

      input.type =
        "text";

      input.value =
        data.name;


      input.addEventListener(
        "input",
        function() {

          data.name =
            input.value;

        }
      );


      row.appendChild(
        number
      );

      row.appendChild(
        input
      );


      nameList.appendChild(
        row
      );

    }
  );

}


/* =====================================================
   ボード表示
===================================================== */

function renderBoard() {

  const project =
    getProject();


  board.innerHTML =
    "";

  board.className =
    "";


  /* 100マス以上 */

  if (
    project.count >= 100
  ) {

    board.classList.add(
      "many"
    );

  }


  /* 列数 */

  if (
    project.count === 1
  ) {

    board.style.gridTemplateColumns =
      "repeat(1, 1fr)";

  }

  else if (
    project.count === 2
  ) {

    board.style.gridTemplateColumns =
      "repeat(2, 1fr)";

  }

  else if (
    project.count <= 4
  ) {

    board.style.gridTemplateColumns =
      "repeat(2, 1fr)";

  }

  else {

    board.style.gridTemplateColumns =
      "repeat(5, minmax(0, 1fr))";

  }


  /* マス作成 */

  project.cells.forEach(

    function(
      data,
      index
    ) {

      const cell =
        document.createElement(
          "div"
        );

      cell.className =
        "cell";


      /* 名前入力済み */

      if (
        data.user !== ""
      ) {

        cell.classList.add(
          "done"
        );

      }


      /* マス名称 */

      const cellName =
        document.createElement(
          "div"
        );

      cellName.className =
        "cellName";

      cellName.textContent =
        data.name;


      /* 視聴者名 */

      const cellUser =
        document.createElement(
          "div"
        );

      cellUser.className =
        "cellUser";

      cellUser.textContent =
        data.user;


      cell.appendChild(
        cellName
      );

      cell.appendChild(
        cellUser
      );


      /* タップ */

      cell.addEventListener(
        "click",
        function() {

          tapCell(index);

        }
      );


      board.appendChild(
        cell
      );

    }
  );

}


/* =====================================================
   全体表示
===================================================== */

function render() {

  const project =
    getProject();


  title.textContent =
    project.title ||
    "参加型企画";


  titleInput.value =
    project.title;


  countInput.value =
    project.count;


  renderBoard();

}


/* =====================================================
   マスをタップ
===================================================== */

function tapCell(index) {

  /* 名前を書くモード */

  if (
    mode !== "name"
  ) {

    return;

  }


  const project =
    getProject();

  const data =
    project.cells[index];


  const result =
    window.prompt(
      data.name +
      "\n\n名前を入力してください",
      data.user
    );


  if (
    result === null
  ) {

    return;

  }


  data.user =
    result.trim();


  saveData();

  renderBoard();

}


/* =====================================================
   マスを作る
===================================================== */

document
  .getElementById(
    "createButton"
  )
  .addEventListener(
    "click",
    function() {

      const project =
        getProject();


      let count =
        parseInt(
          countInput.value,
          10
        );


      if (
        isNaN(count)
      ) {

        count = 1;

      }


      count =
        Math.max(
          1,
          Math.min(
            200,
            count
          )
        );


      project.count =
        count;


      /* マスを増やす */

      while (
        project.cells.length <
        count
      ) {

        const number =
          project.cells.length + 1;


        project.cells.push({

          name:
            "マス" + number,

          user:
            ""

        });

      }


      /* マスを減らす */

      if (
        project.cells.length >
        count
      ) {

        project.cells =
          project.cells.slice(
            0,
            count
          );

      }


      saveData();

      render();

    }
  );


/* =====================================================
   ★ マス名称変更
   押した時だけ一覧表示
===================================================== */

nameEditButton
  .addEventListener(
    "click",
    function() {

      /* 現在閉じている */

      if (
        nameEditor.style.display !==
        "block"
      ) {

        nameEditor.style.display =
          "block";


        renderNameList();


        nameEditButton.textContent =
          "✖ 名称一覧を閉じる";


        mode =
          "edit";


        modeText.textContent =
          "📝 マス名称変更中";


        /* 一覧の場所まで移動 */

        nameEditor.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });

      }

      /* 現在開いている */

      else {

        nameEditor.style.display =
          "none";


        nameEditButton.textContent =
          "📝 マス名称変更";


        mode =
          "name";


        modeText.textContent =
          "✏️「名前を書く」モード";

      }

    }
  );


/* =====================================================
   ★ 名前を書く
===================================================== */

document
  .getElementById(
    "nameButton"
  )
  .addEventListener(
    "click",
    function() {

      mode =
        "name";


      modeText.textContent =
        "✏️「名前を書く」モード";


      /* 名称一覧を閉じる */

      nameEditor.style.display =
        "none";


      nameEditButton.textContent =
        "📝 マス名称変更";

    }
  );


/* =====================================================
   名称保存
===================================================== */

document
  .getElementById(
    "saveNamesButton"
  )
  .addEventListener(
    "click",
    function() {

      const project =
        getProject();


      const inputs =
        document.querySelectorAll(
          ".nameInput"
        );


      inputs.forEach(
        function(
          input,
          index
        ) {

          if (
            project.cells[index]
          ) {

            const value =
              input.value.trim();


            if (
              value !== ""
            ) {

              project.cells[index].name =
                value;

            }

          }

        }
      );


      saveData();

      renderBoard();


      alert(
        "マス名称を保存しました！"
      );

    }
  );


/* =====================================================
   名前リセット
===================================================== */

document
  .getElementById(
    "resetButton"
  )
  .addEventListener(
    "click",
    function() {

      const ok =
        window.confirm(
          "企画" +
          currentProject +
          "の名前をすべて消しますか？"
        );


      if (
        !ok
      ) {

        return;

      }


      const project =
        getProject();


      project.cells.forEach(
        function(data) {

          data.user =
            "";

        }
      );


      saveData();

      renderBoard();

    }
  );


/* =====================================================
   タイトル変更
===================================================== */

titleInput.addEventListener(
  "input",
  function() {

    const project =
      getProject();


    project.title =
      titleInput.value;


    title.textContent =
      titleInput.value ||
      "参加型企画";


    saveData();

  }
);


/* =====================================================
   企画切り替え
===================================================== */

function switchProject(number) {

  currentProject =
    number;


  /* ボタンの色 */

  document
    .querySelectorAll(
      ".projectTab"
    )
    .forEach(
      function(
        button,
        index
      ) {

        button.classList.toggle(
          "active",
          index + 1 ===
          currentProject
        );

      }
    );


  /* 名称一覧は必ず閉じる */

  nameEditor.style.display =
    "none";


  nameEditButton.textContent =
    "📝 マス名称変更";


  /* 名前を書くモード */

  mode =
    "name";


  modeText.textContent =
    "✏️「名前を書く」モード";


  render();

}


/* =====================================================
   企画①
===================================================== */

document
  .getElementById(
    "project1"
  )
  .addEventListener(
    "click",
    function() {

      switchProject(1);

    }
  );


/* =====================================================
   企画②
===================================================== */

document
  .getElementById(
    "project2"
  )
  .addEventListener(
    "click",
    function() {

      switchProject(2);

    }
  );


/* =====================================================
   企画③
===================================================== */

document
  .getElementById(
    "project3"
  )
  .addEventListener(
    "click",
    function() {

      switchProject(3);

    }
  );


/* =====================================================
   初期表示
===================================================== */

nameEditor.style.display =
  "none";


render();

</script>

</body>
</html>
