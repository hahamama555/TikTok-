<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>マス目名前書きツール</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  background: #ffffff;
}

body {
  margin: 0;
  padding: 15px 10px 30px;
  background: #ffffff;
  color: #222;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    "Noto Sans JP",
    sans-serif;
}

/* =========================
   設定画面
========================= */

#settings {
  max-width: 900px;
  margin: 0 auto 15px;
  padding: 15px;
  border: 2px solid #ddd;
  border-radius: 15px;
  background: #f7f7f7;
}

#settings h2 {
  margin: 0 0 12px;
  font-size: 20px;
  text-align: center;
}

.setting-row {
  margin-bottom: 12px;
}

.setting-row label {
  display: block;
  margin-bottom: 5px;
  font-weight: bold;
}

input[type="text"],
input[type="number"] {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  border: 1px solid #bbb;
  border-radius: 8px;
  background: #ffffff;
  color: #222;
}

button {
  border: none;
  border-radius: 9px;
  padding: 11px 15px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

button:active {
  transform: scale(0.97);
}

.button-area {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}

.btn-blue {
  background: #2196f3;
  color: #ffffff;
}

.btn-green {
  background: #20a060;
  color: #ffffff;
}

.btn-gray {
  background: #777777;
  color: #ffffff;
}

.btn-red {
  background: #e53935;
  color: #ffffff;
}

.help-text {
  margin-top: 10px;
  color: #666;
  font-size: 13px;
  line-height: 1.6;
}

/* =========================
   タイトル
========================= */

#boardTitle {
  max-width: 1000px;
  margin: 10px auto 15px;
  text-align: center;
  font-size: clamp(22px, 6vw, 42px);
  font-weight: bold;
}

/* =========================
   モード表示
========================= */

#modeText {
  max-width: 1000px;
  margin: 0 auto 12px;
  text-align: center;
  font-size: 14px;
  color: #666666;
}

/* =========================
   ボード
========================= */

#board {
  width: 100%;
  max-width: 1000px;
  margin: 0 auto;

  display: grid;

  gap: 5px;
}

/* =========================
   マス
========================= */

.cell {
  min-width: 0;
  min-height: 70px;

  padding: 6px 4px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  text-align: center;

  background: #9edff5;
  color: #222222;

  border: 2px solid #62bcd9;
  border-radius: 8px;

  font-size: clamp(12px, 3.2vw, 22px);
  font-weight: bold;

  user-select: none;
  -webkit-user-select: none;

  cursor: pointer;
  touch-action: manipulation;

  transition:
    background 0.15s,
    color 0.15s,
    transform 0.1s;
}

/* =========================
   マス名称
========================= */

.cell .place {
  display: block;

  width: 100%;

  line-height: 1.2;

  word-break: break-word;
  overflow-wrap: anywhere;
}

/* =========================
   名前
========================= */

.cell .name-text {
  display: block;

  width: 100%;

  margin-top: 5px;

  font-size: 0.72em;
  line-height: 1.2;

  white-space: nowrap;

  overflow: hidden;
  text-overflow: ellipsis;
}

/* =========================
   名前が入ったマス
========================= */

.cell.completed {
  background: #e53935;
  border-color: #b71c1c;

  color: #ffffff;
}

/* =========================
   タップ時
========================= */

.cell:active {
  transform: scale(0.97);
}

/* =========================
   配信用画面
========================= */

body.live-mode {
  padding: 0 8px 30px;
}

body.live-mode #settings {
  display: none;
}

body.live-mode #modeText {
  display: none;
}

body.live-mode #boardTitle {
  margin-top: 8px;
}

/* =========================
   小さいスマホ
========================= */

@media (max-width: 500px) {

  body {
    padding-left: 5px;
    padding-right: 5px;
    padding-bottom: 30px;
  }

  #settings {
    padding: 10px;
  }

  .cell {
    min-height: 65px;
    border-radius: 7px;
  }

  #board {
    gap: 4px;
  }

}

/* =========================
   縦長スマホでマスを少し大きく
========================= */

@media (max-width: 500px) and (min-height: 700px) {

  .cell {
    min-height: 72px;
  }

}

</style>
</head>


<body>


<!-- =========================
     設定
========================= -->

<div id="settings">

  <h2>⚙️ ボード設定</h2>


  <!-- タイトル -->

  <div class="setting-row">

    <label for="titleInput">
      タイトル
    </label>

    <input
      id="titleInput"
      type="text"
      value="47都道府県制覇！"
      placeholder="タイトルを入力">

  </div>


  <!-- マス数 -->

  <div class="setting-row">

    <label for="countInput">
      マス数（1〜200）
    </label>

    <input
      id="countInput"
      type="number"
      value="47"
      min="1"
      max="200"
      inputmode="numeric">

  </div>


  <!-- ボタン -->

  <div class="button-area">

    <button
      id="createButton"
      class="btn-blue">

      マスを作成

    </button>


    <button
      id="nameModeButton"
      class="btn-green">

      ✏️ 名前を書く

    </button>


    <button
      id="editModeButton"
      class="btn-gray">

      📝 マス名称変更

    </button>


    <button
      id="resetButton"
      class="btn-red">

      🔄 リセット

    </button>


    <button
      id="liveButton"
      class="btn-gray">

      📺 配信用画面

    </button>

  </div>


  <div class="help-text">

    「マス名称変更」
    → マスをタップすると名称を変更できます。

    <br>

    「名前を書く」
    → マスをタップすると名前を入力できます。

    <br>

    名前が入ったマスは赤色になります。

  </div>

</div>


<!-- =========================
     タイトル
========================= -->

<h1 id="boardTitle">
  47都道府県制覇！
</h1>


<!-- =========================
     モード
========================= -->

<div id="modeText">
  📝 マス名称変更モード
</div>


<!-- =========================
     ボード
========================= -->

<div id="board"></div>



<script>

/* ==================================================
   初期のマス名称
================================================== */

const defaultNames = [

  "北海道",
  "青森県",
  "岩手県",
  "宮城県",
  "秋田県",

  "山形県",
  "福島県",
  "茨城県",
  "栃木県",
  "群馬県",

  "埼玉県",
  "千葉県",
  "東京都",
  "神奈川県",
  "新潟県",

  "富山県",
  "石川県",
  "福井県",
  "山梨県",
  "長野県",

  "岐阜県",
  "静岡県",
  "愛知県",
  "三重県",
  "滋賀県",

  "京都府",
  "大阪府",
  "兵庫県",
  "奈良県",
  "和歌山県",

  "鳥取県",
  "島根県",
  "岡山県",
  "広島県",
  "山口県",

  "徳島県",
  "香川県",
  "愛媛県",
  "高知県",
  "福岡県",

  "佐賀県",
  "長崎県",
  "熊本県",
  "大分県",
  "宮崎県",

  "鹿児島県",
  "沖縄県"

];


/* ==================================================
   状態
================================================== */

let cells = [];

let mode = "edit";


/* ==================================================
   HTML要素
================================================== */

const board =
  document.getElementById("board");

const titleInput =
  document.getElementById("titleInput");

const countInput =
  document.getElementById("countInput");

const boardTitle =
  document.getElementById("boardTitle");

const modeText =
  document.getElementById("modeText");

const createButton =
  document.getElementById("createButton");

const nameModeButton =
  document.getElementById("nameModeButton");

const editModeButton =
  document.getElementById("editModeButton");

const resetButton =
  document.getElementById("resetButton");

const liveButton =
  document.getElementById("liveButton");


/* ==================================================
   ボード作成
================================================== */

function createBoard() {

  let count =
    parseInt(
      countInput.value,
      10
    );


  if (isNaN(count)) {

    count = 1;

  }


  if (count < 1) {

    count = 1;

  }


  if (count > 200) {

    count = 200;

  }


  countInput.value = count;


  boardTitle.textContent =
    titleInput.value.trim()
    || "タイトル";


  cells = [];


  for (
    let i = 0;
    i < count;
    i++
  ) {

    cells.push({

      name:
        defaultNames[i]
        || "マス" + (i + 1),

      person: "",

      completed: false

    });

  }


  renderBoard();

}


/* ==================================================
   ボード表示
================================================== */

function renderBoard() {

  board.innerHTML = "";


  const count =
    cells.length;


  /*

    マス数によって列数を変更

    47マス → 5列
    200マス → 5列

  */

  let columns = 5;


  if (count === 1) {

    columns = 1;

  }

  else if (count === 2) {

    columns = 2;

  }

  else if (count <= 4) {

    columns = 2;

  }

  else if (count <= 6) {

    columns = 3;

  }


  board.style.gridTemplateColumns =
    `repeat(
      ${columns},
      minmax(0, 1fr)
    )`;


  /* =========================
     マスを作成
  ========================= */

  cells.forEach(
    function(cellData, index) {

      const cell =
        document.createElement("div");


      cell.className =
        "cell";


      /* 名前が入っている */

      if (
        cellData.completed
      ) {

        cell.classList.add(
          "completed"
        );

      }


      /* =========================
         マス名称
      ========================= */

      const place =
        document.createElement(
          "span"
        );

      place.className =
        "place";

      place.textContent =
        cellData.name;


      cell.appendChild(place);


      /* =========================
         名前
      ========================= */

      if (
        cellData.person
      ) {

        const person =
          document.createElement(
            "span"
          );

        person.className =
          "name-text";

        person.textContent =
          cellData.person;


        cell.appendChild(person);

      }


      /* =========================
         タップ処理
      ========================= */

      cell.addEventListener(
        "click",
        function() {

          handleCellClick(index);

        }
      );


      board.appendChild(cell);

    }
  );

}


/* ==================================================
   マスをタップしたとき
================================================== */

function handleCellClick(index) {

  const cellData =
    cells[index];


  /* ==================================================
     マス名称変更
  ================================================== */

  if (mode === "edit") {

    const newName =
      prompt(
        "マスの名称を入力してください",
        cellData.name
      );


    if (newName !== null) {

      const trimmed =
        newName.trim();


      if (trimmed !== "") {

        cellData.name =
          trimmed;

      }


      renderBoard();

    }


    return;

  }


  /* ==================================================
     名前を書く
  ================================================== */

  if (mode === "name") {

    const personName =
      prompt(

        cellData.name +
        " に名前を書きます。\n\n" +
        "名前を入力してください。",

        cellData.person || ""

      );


    if (personName !== null) {

      const trimmed =
        personName.trim();


      /* 名前を消した場合 */

      if (trimmed === "") {

        cellData.person =
          "";

        cellData.completed =
          false;

      }


      /* 名前を入力した場合 */

      else {

        cellData.person =
          trimmed;

        cellData.completed =
          true;

      }


      renderBoard();

    }

  }

}


/* ==================================================
   モード変更
================================================== */

function setMode(newMode) {

  mode =
    newMode;


  if (mode === "edit") {

    modeText.textContent =
      "📝 マス名称変更モード";

  }


  if (mode === "name") {

    modeText.textContent =
      "✏️ 名前を書くモード";

  }

}


/* ==================================================
   マスを作成
================================================== */

createButton.addEventListener(
  "click",
  function() {

    createBoard();

  }
);


/* ==================================================
   名前を書くモード
================================================== */

nameModeButton.addEventListener(
  "click",
  function() {

    setMode("name");

  }
);


/* ==================================================
   マス名称変更モード
================================================== */

editModeButton.addEventListener(
  "click",
  function() {

    setMode("edit");

  }
);


/* ==================================================
   リセット
================================================== */

resetButton.addEventListener(
  "click",
  function() {

    const ok =
      confirm(
        "すべての名前を消してリセットしますか？"
      );


    if (!ok) {

      return;

    }


    cells.forEach(
      function(cell) {

        cell.person =
          "";

        cell.completed =
          false;

      }
    );


    renderBoard();

  }
);


/* ==================================================
   配信用画面
================================================== */

liveButton.addEventListener(
  "click",
  function() {

    document.body.classList.toggle(
      "live-mode"
    );


    if (
      document.body.classList.contains(
        "live-mode"
      )
    ) {

      liveButton.textContent =
        "↩️ 設定画面に戻る";

    }

    else {

      liveButton.textContent =
        "📺 配信用画面";

    }

  }
);


/* ==================================================
   タイトルをリアルタイム変更
================================================== */

titleInput.addEventListener(
  "input",
  function() {

    boardTitle.textContent =
      titleInput.value.trim()
      || "タイトル";

  }
);


/* ==================================================
   最初の表示
================================================== */

createBoard();

</script>


</body>
</html>
