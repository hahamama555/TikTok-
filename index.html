<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>3企画切り替えボード</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #ffffff;
}

body {
  padding: 8px 5px 50px;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    "Noto Sans JP",
    sans-serif;

  color: #222;
}


/* =========================
   企画切り替え
========================= */

#projectTabs {
  width: 100%;
  max-width: 1000px;

  margin: 0 auto 8px;

  display: grid;
  grid-template-columns: repeat(3, 1fr);

  gap: 5px;
}

.projectTab {
  min-height: 44px;

  border: none;
  border-radius: 8px;

  background: #dddddd;
  color: #333333;

  font-size: 15px;
  font-weight: bold;

  cursor: pointer;
  touch-action: manipulation;
}

.projectTab.active {
  background: #2196f3;
  color: #ffffff;
}

.projectTab:active {
  transform: scale(0.96);
}


/* =========================
   設定
========================= */

#settings {
  width: 100%;
  max-width: 900px;

  margin: 0 auto 10px;
  padding: 10px;

  background: #f5f5f5;

  border: 1px solid #dddddd;
  border-radius: 11px;
}

#settings-title {
  margin-bottom: 10px;

  text-align: center;

  font-size: 18px;
  font-weight: bold;
}


/* =========================
   設定入力
========================= */

.setting-row {
  margin-bottom: 9px;
}

.setting-row label {
  display: block;

  margin-bottom: 4px;

  font-size: 13px;
  font-weight: bold;
}

.setting-row input {
  width: 100%;
  height: 42px;

  padding: 7px 9px;

  background: #ffffff;
  color: #222222;

  border: 1px solid #aaaaaa;
  border-radius: 7px;

  font-size: 16px;

  outline: none;
}


/* =========================
   ボタン
========================= */

.buttons {
  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 6px;

  margin-top: 7px;
}

button {
  min-height: 42px;

  padding: 7px 4px;

  border: none;
  border-radius: 8px;

  font-size: 13px;
  font-weight: bold;

  color: #ffffff;

  cursor: pointer;

  touch-action: manipulation;
}

button:active {
  transform: scale(0.96);
}

#createButton {
  background: #2196f3;
}

#nameButton {
  background: #f57c00;
}

#saveNamesButton {
  background: #43a047;
}

#resetButton {
  background: #e53935;
}


/* =========================
   名称一覧
========================= */

#nameEditor {
  margin-top: 12px;

  padding-top: 10px;

  border-top:
    1px solid #cccccc;
}

#nameEditorTitle {
  margin-bottom: 8px;

  text-align: center;

  font-size: 15px;
  font-weight: bold;
}

#nameList {
  display: flex;

  flex-direction: column;

  gap: 5px;

  max-height: 420px;

  overflow-y: auto;

  padding-right: 2px;
}

.name-row {
  display: grid;

  grid-template-columns:
    38px minmax(0, 1fr);

  gap: 5px;

  align-items: center;
}

.name-number {
  text-align: center;

  font-size: 12px;

  font-weight: bold;

  color: #666666;
}

.name-input {
  width: 100%;

  height: 38px;

  padding:
    5px 8px;

  background: #ffffff;

  border:
    1px solid #bbbbbb;

  border-radius: 6px;

  font-size: 14px;

  outline: none;
}

.name-input:focus {
  border-color: #2196f3;
}


/* =========================
   モード
========================= */

#mode {
  width: 100%;
  max-width: 900px;

  margin: 4px auto 7px;

  text-align: center;

  font-size: 12px;

  color: #666666;
}


/* =========================
   タイトル
========================= */

#title {
  width: 100%;
  max-width: 1000px;

  margin: 5px auto 9px;

  text-align: center;

  font-size:
    clamp(21px, 6vw, 40px);

  line-height: 1.2;

  font-weight: bold;

  word-break: break-word;
}


/* =========================
   ボード
========================= */

#board {
  width: 100%;
  max-width: 1000px;

  margin: 0 auto;

  display: grid;

  grid-template-columns:
    repeat(5, minmax(0, 1fr));

  gap: 5px;
}


/* =========================
   マス
========================= */

.cell {
  width: 100%;

  min-width: 0;

  min-height: 70px;

  padding: 7px 3px;

  background: #9edff5;

  border:
    2px solid #55b4d4;

  border-radius: 8px;

  display: flex;

  flex-direction: column;

  justify-content: center;

  align-items: center;

  text-align: center;

  cursor: pointer;

  user-select: none;

  touch-action: manipulation;

  overflow: hidden;
}

.cell:active {
  transform: scale(0.96);
}


/* =========================
   マス名称
========================= */

.cell-name {
  display: block;

  width: 100%;

  margin: 0;
  padding: 0;

  color: #111111;

  font-size:
    clamp(11px, 3vw, 21px);

  font-weight: bold;

  line-height: 1.2;

  text-align: center;

  white-space: normal;

  word-break: break-all;

  writing-mode: horizontal-tb;
}


/* =========================
   視聴者名
========================= */

.cell-user {
  display: block;

  width: 100%;

  margin: 5px 0 0;
  padding: 0;

  color: #111111;

  font-size:
    clamp(9px, 2.5vw, 17px);

  font-weight: bold;

  line-height: 1.2;

  text-align: center;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

  writing-mode: horizontal-tb;
}


/* =========================
   名前入力後
   赤マス＋白文字
========================= */

.cell.completed {
  background: #e53935;

  border-color: #b71c1c;
}

.cell.completed .cell-name,
.cell.completed .cell-user {
  color: #ffffff;
}


/* =========================
   100〜200マス
========================= */

.many .cell {
  min-height: 50px;

  padding:
    4px 2px;
}

.many .cell-name {
  font-size: 9px;
}

.many .cell-user {
  font-size: 7px;

  margin-top: 2px;
}


/* =========================
   少ないマス
========================= */

.board-one {
  grid-template-columns:
    repeat(1, 1fr) !important;
}

.board-two {
  grid-template-columns:
    repeat(2, 1fr) !important;
}

.board-three {
  grid-template-columns:
    repeat(3, 1fr) !important;
}

.board-four {
  grid-template-columns:
    repeat(4, 1fr) !important;
}


/* =========================
   スマホ
========================= */

@media (max-width: 500px) {

  body {
    padding:
      5px 4px 40px;
  }

  .projectTab {
    min-height: 40px;

    font-size: 14px;
  }

  #settings {
    padding: 9px;
  }

  #board {
    gap: 4px;
  }

  .cell {
    min-height: 65px;

    padding:
      6px 2px;

    border-radius: 7px;
  }

  .cell-name {
    font-size:
      clamp(10px, 3vw, 15px);
  }

  .cell-user {
    margin-top: 4px;

    font-size:
      clamp(8px, 2.3vw, 13px);
  }

}

</style>
</head>


<body>


<!-- =========================
     企画切り替え
========================= -->

<div id="projectTabs">

  <button
    id="tab1"
    class="projectTab active">
    企画①
  </button>

  <button
    id="tab2"
    class="projectTab">
    企画②
  </button>

  <button
    id="tab3"
    class="projectTab">
    企画③
  </button>

</div>


<!-- =========================
     設定
========================= -->

<div id="settings">

  <div id="settings-title">
    ⚙️ 企画① ボード設定
  </div>


  <div class="setting-row">

    <label>
      タイトル
    </label>

    <input
      id="titleInput"
      type="text"
      value="47都道府県制覇！">

  </div>


  <div class="setting-row">

    <label>
      マス数（1〜200）
    </label>

    <input
      id="countInput"
      type="number"
      value="47"
      min="1"
      max="200">

  </div>


  <div class="buttons">

    <button id="createButton">
      マスを作る
    </button>

    <button id="nameButton">
      ✏️ 名前を書く
    </button>

    <button id="saveNamesButton">
      💾 名称を保存
    </button>

    <button id="resetButton">
      🔄 名前リセット
    </button>

  </div>


  <!-- =========================
       名称一覧
  ========================= -->

  <div id="nameEditor">

    <div id="nameEditorTitle">
      📝 マス名称一覧
    </div>

    <div id="nameList"></div>

  </div>

</div>


<!-- =========================
     モード
========================= -->

<div id="mode">
  ✏️ マスをタップすると名前を書けます
</div>


<!-- =========================
     タイトル
========================= -->

<div id="title">
  47都道府県制覇！
</div>


<!-- =========================
     ボード
========================= -->

<div id="board"></div>


<script>


/* ==========================================
   都道府県
========================================== */

const prefectures = [

  "北海道",
  "青森県",
  "岩手県",
  "宮城県",
  "秋田県",
  "山形県",
  "福島県",

  "茨城県",
  "栃木県",
  "群馬県",
  "埼玉県",
  "千葉県",
  "東京都",
  "神奈川県",

  "新潟県",
  "富山県",
  "石川県",
  "福井県",
  "山梨県",
  "長野県",

  "岐阜県",
  "静岡県",
  "愛知県",
  "三重県",

  "滋賀県",
  "京都府",
  "大阪府",
  "兵庫県",
  "奈良県",
  "和歌山県",

  "鳥取県",
  "島根県",
  "岡山県",
  "広島県",
  "山口県",

  "徳島県",
  "香川県",
  "愛媛県",
  "高知県",

  "福岡県",
  "佐賀県",
  "長崎県",
  "熊本県",
  "大分県",
  "宮崎県",
  "鹿児島県",
  "沖縄県"

];


/* ==========================================
   初期マス
========================================== */

function makeCells(count, usePrefectures) {

  const result = [];

  for (let i = 0; i < count; i++) {

    let name;

    if (
      usePrefectures &&
      i < prefectures.length
    ) {

      name = prefectures[i];

    } else {

      name = "マス" + (i + 1);

    }

    result.push({

      name: name,

      user: ""

    });

  }

  return result;

}


/* ==========================================
   3つの企画
========================================== */

const projects = {

  1: {

    title: "47都道府県制覇！",

    count: 47,

    cells:
      makeCells(47, true)

  },

  2: {

    title: "企画②",

    count: 25,

    cells:
      makeCells(25, false)

  },

  3: {

    title: "企画③",

    count: 25,

    cells:
      makeCells(25, false)

  }

};


/* ==========================================
   保存データ読み込み
========================================== */

function loadData() {

  try {

    const saved =
      localStorage.getItem(
        "threeProjectBoard_v3"
      );

    if (!saved) {
      return;
    }

    const data =
      JSON.parse(saved);

    for (let i = 1; i <= 3; i++) {

      if (!data[i]) {
        continue;
      }

      if (
        typeof data[i].title ===
        "string"
      ) {

        projects[i].title =
          data[i].title;

      }

      if (
        typeof data[i].count ===
        "number"
      ) {

        projects[i].count =
          data[i].count;

      }

      if (
        Array.isArray(data[i].cells)
      ) {

        projects[i].cells =
          data[i].cells;

      }

    }

  } catch (e) {

    console.log(e);

  }

}


loadData();


/* ==========================================
   現在の企画
========================================== */

let currentProject = 1;


/* ==========================================
   要素
========================================== */

const board =
  document.getElementById("board");

const title =
  document.getElementById("title");

const titleInput =
  document.getElementById("titleInput");

const countInput =
  document.getElementById("countInput");

const nameList =
  document.getElementById("nameList");

const settingsTitle =
  document.getElementById(
    "settings-title"
  );


/* ==========================================
   現在の企画データ
========================================== */

function getProject() {

  return projects[currentProject];

}


/* ==========================================
   保存
========================================== */

function saveData() {

  localStorage.setItem(

    "threeProjectBoard_v3",

    JSON.stringify(projects)

  );

}


/* ==========================================
   マス数調整
========================================== */

function adjustCells(project) {

  let count =
    parseInt(project.count, 10);

  if (isNaN(count)) {
    count = 1;
  }

  count =
    Math.max(
      1,
      Math.min(
        200,
        count
      )
    );

  project.count = count;


  while (
    project.cells.length < count
  ) {

    const number =
      project.cells.length + 1;

    project.cells.push({

      name:
        "マス" + number,

      user: ""

    });

  }


  if (
    project.cells.length > count
  ) {

    project.cells =
      project.cells.slice(
        0,
        count
      );

  }

}


/* ==========================================
   名称一覧
========================================== */

function renderNameList() {

  const project =
    getProject();

  nameList.innerHTML = "";


  project.cells.forEach(
    function(data, index) {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "name-row";


      const number =
        document.createElement(
          "div"
        );

      number.className =
        "name-number";

      number.textContent =
        index + 1;


      const input =
        document.createElement(
          "input"
        );

      input.className =
        "name-input";

      input.type =
        "text";

      input.value =
        data.name;


      input.addEventListener(
        "input",
        function() {

          data.name =
            input.value;

        }
      );


      row.appendChild(number);

      row.appendChild(input);

      nameList.appendChild(row);

    }
  );

}


/* ==========================================
   ボード表示
========================================== */

function render() {

  const project =
    getProject();


  adjustCells(project);


  title.textContent =
    project.title ||
    "参加型企画";


  titleInput.value =
    project.title;


  countInput.value =
    project.count;


  settingsTitle.textContent =
    "⚙️ 企画" +
    currentProject +
    " ボード設定";


  board.innerHTML = "";

  board.className = "";


  /* 列数 */

  if (project.count === 1) {

    board.classList.add(
      "board-one"
    );

  }
  else if (project.count === 2) {

    board.classList.add(
      "board-two"
    );

  }
  else if (project.count === 3) {

    board.classList.add(
      "board-three"
    );

  }
  else if (project.count === 4) {

    board.classList.add(
      "board-four"
    );

  }


  if (project.count >= 100) {

    board.classList.add(
      "many"
    );

  }


  /* マス作成 */

  project.cells.forEach(
    function(data, index) {

      const cell =
        document.createElement(
          "div"
        );

      cell.className =
        "cell";


      if (
        data.user &&
        data.user.trim() !== ""
      ) {

        cell.classList.add(
          "completed"
        );

      }


      const name =
        document.createElement(
          "div"
        );

      name.className =
        "cell-name";

      name.textContent =
        data.name;


      const user =
        document.createElement(
          "div"
        );

      user.className =
        "cell-user";

      user.textContent =
        data.user;


      cell.appendChild(name);

      cell.appendChild(user);


      /* タップで名前入力 */

      cell.addEventListener(
        "click",
        function() {

          writeUserName(index);

        }
      );


      board.appendChild(cell);

    }
  );


  renderNameList();

  saveData();

}


/* ==========================================
   名前を書く
========================================== */

function writeUserName(index) {

  const project =
    getProject();

  const data =
    project.cells[index];


  const newUser =
    window.prompt(

      data.name +
      "\n\n名前を書きます。\n" +
      "視聴者の名前を入力してください。",

      data.user

    );


  if (newUser === null) {
    return;
  }


  data.user =
    newUser.trim();


  saveData();

  render();

}


/* ==========================================
   タイトル変更
========================================== */

titleInput.addEventListener(
  "input",
  function() {

    const project =
      getProject();

    project.title =
      titleInput.value;

    title.textContent =
      titleInput.value ||
      "参加型企画";

    saveData();

  }
);


/* ==========================================
   マスを作る
========================================== */

document
  .getElementById("createButton")
  .addEventListener(
    "click",
    function() {

      const project =
        getProject();

      let count =
        parseInt(
          countInput.value,
          10
        );


      if (isNaN(count)) {
        count = 1;
      }


      count =
        Math.max(
          1,
          Math.min(
            200,
            count
          )
        );


      project.count =
        count;


      adjustCells(project);

      saveData();

      render();

    }
  );


/* ==========================================
   名前を書く
========================================== */

document
  .getElementById("nameButton")
  .addEventListener(
    "click",
    function() {

      alert(
        "ボードのマスをタップすると、\n視聴者の名前を入力できます。"
      );

    }
  );


/* ==========================================
   名称を保存
========================================== */

document
  .getElementById("saveNamesButton")
  .addEventListener(
    "click",
    function() {

      const project =
        getProject();

      const inputs =
        document.querySelectorAll(
          ".name-input"
        );


      inputs.forEach(
        function(input, index) {

          if (
            project.cells[index]
          ) {

            project.cells[index].name =
              input.value;

          }

        }
      );


      saveData();

      render();

      alert(
        "マス名称を保存しました！"
      );

    }
  );


/* ==========================================
   名前リセット
========================================== */

document
  .getElementById("resetButton")
  .addEventListener(
    "click",
    function() {

      const ok =
        window.confirm(

          "企画" +
          currentProject +
          "の名前をすべて消しますか？"

        );


      if (!ok) {
        return;
      }


      const project =
        getProject();


      project.cells.forEach(
        function(data) {

          data.user = "";

        }
      );


      saveData();

      render();

    }
  );


/* ==========================================
   企画①
========================================== */

document
  .getElementById("tab1")
  .addEventListener(
    "click",
    function() {

      currentProject = 1;

      updateTabs();

      render();

    }
  );


/* ==========================================
   企画②
========================================== */

document
  .getElementById("tab2")
  .addEventListener(
    "click",
    function() {

      currentProject = 2;

      updateTabs();

      render();

    }
  );


/* ==========================================
   企画③
========================================== */

document
  .getElementById("tab3")
  .addEventListener(
    "click",
    function() {

      currentProject = 3;

      updateTabs();

      render();

    }
  );


/* ==========================================
   タブ表示更新
========================================== */

function updateTabs() {

  document
    .querySelectorAll(".projectTab")
    .forEach(
      function(tab, index) {

        tab.classList.toggle(
          "active",
          index + 1 ===
          currentProject
        );

      }
    );

}


/* ==========================================
   最初に表示
========================================== */

updateTabs();

render();

</script>

</body>
</html>
